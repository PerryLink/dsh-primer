<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">dsh-primer 双通道汇流结构图</title>
<desc id="figdesc">只读 bundle 分成两条通道。认知层：cordis.patch.yml 插一行、index.js 的 apply 调 ctx.skills.register 注册技能，会话技能目录常驻 name + description，SKILL.md 正文与 guide/、references/ 按需读取。机械层：dsh-plugin-dev 的 new 生成脚手架，check 跑 16 项静态检查（每项带 skillRef），verify 打包后在干净 profile 冒烟，seams 查询 26 条破坏性变更。两条通道汇成同一个结论：插件对目标宿主成立。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.28" y2="1">
    <stop offset="0" stop-color="#f9f6fd"/><stop offset="1" stop-color="#e4eaf8"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1b1735" flood-opacity="0.13"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#e7e4f0"/>
  </pattern>
  <marker id="mkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4B67B4"/>
  </marker>
  <marker id="mkG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
  </marker>
</defs>
<rect width="1100" height="660" fill="url(#bg)"/>
<rect width="1100" height="660" fill="url(#dots)" opacity=".45"/>

<!-- header -->
<text x="48" y="58" fill="#141419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700">dsh-primer</text>
<text x="48" y="88" fill="#4d5261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14.5">一个 bundle，两条通道：知识按需进上下文，检查逐条留证据</text>
<text x="1052" y="86" text-anchor="end" fill="#8f94a4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5">inject: skills · 不注册工具 / 命令 / slot</text>
<line x1="40" y1="100" x2="1060" y2="100" stroke="#e7e4f0" stroke-width="1.4"/>

